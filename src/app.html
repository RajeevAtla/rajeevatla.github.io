<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Set the theme before styles paint; storage can be unavailable.
			let preferredTheme;
			try {
				preferredTheme = localStorage.getItem("website-theme");
			} catch {
				// Fall back to the system preference.
			}
			const initialTheme =
				preferredTheme === "rajevlight" || preferredTheme === "rajevdark"
					? preferredTheme
					: window.matchMedia("(prefers-color-scheme: dark)").matches
						? "rajevdark"
						: "rajevlight";
			document.documentElement.dataset.theme = initialTheme;
			document.documentElement.style.colorScheme =
				initialTheme === "rajevdark" ? "dark" : "light";
		</script>
		<script
			async
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4519357571236067"
			crossorigin="anonymous"
		></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
